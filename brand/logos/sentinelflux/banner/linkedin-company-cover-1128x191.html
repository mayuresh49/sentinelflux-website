<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
*{margin:0;box-sizing:border-box}html,body{width:1128px;height:191px;overflow:hidden}
body{font-family:Inter,sans-serif;color:#fff;position:relative;background:linear-gradient(115deg,#0b1020 0%,#1e1b4b 55%,#312e81 100%)}
.glow{position:absolute;right:-96px;top:-125px;width:367px;height:367px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.5),transparent 65%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(165,180,252,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(165,180,252,.07) 1px,transparent 1px);background-size:21px 21px;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 60%)}
.ring{position:absolute;left:34px;top:50%;transform:translateY(-50%);width:125px;height:125px;border-radius:50%;border:1.0px solid rgba(165,180,252,.22)}
.ring.r2{width:87px;height:87px;left:53px;border-color:rgba(165,180,252,.30)}
.txt{position:absolute;left:338px;top:50%;transform:translateY(-50%);right:24px}
h1{font-size:22px;line-height:1.12;font-weight:800;letter-spacing:-.025em}
h1 span{background:linear-gradient(135deg,#a5b4fc,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:13px}
.chips i{font-style:normal;font-weight:600;font-size:9px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(165,180,252,.28);color:#e0e7ff}
.url{position:absolute;right:24px;bottom:13px;font-size:9px;font-weight:600;color:#a5b4fc}
.brand{position:absolute;left:40px;top:22px;display:flex;align-items:center;gap:10px}.brand img{width:34px;height:34px}.brand span{font-weight:700;font-size:20px;letter-spacing:-.02em}</style></head><body><div class="glow"></div><div class="grid"></div><div class="brand"><img src="../final/sentinelflux-mark.svg"><span>SentinelFlux</span></div>
<div class="txt"><h1>AI-powered tools for the<br><span>software delivery lifecycle</span></h1><div class="chips"><i>VigilQA</i><i>SpecVault</i><i>AgentPulse</i><i>DocForge</i><i>TalentDesk</i></div></div>
<div class="url">sentinelflux.in</div></body></html>
