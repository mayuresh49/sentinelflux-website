<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
*{margin:0;box-sizing:border-box}html,body{width:1584px;height:396px;overflow:hidden}
body{font-family:Inter,sans-serif;color:#fff;position:relative;background:linear-gradient(115deg,#0b1020 0%,#1e1b4b 55%,#312e81 100%)}
.glow{position:absolute;right:-200px;top:-260px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.5),transparent 65%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(165,180,252,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(165,180,252,.07) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 60%)}
.ring{position:absolute;left:70px;top:50%;transform:translateY(-50%);width:260px;height:260px;border-radius:50%;border:2.0px solid rgba(165,180,252,.22)}
.ring.r2{width:180px;height:180px;left:110px;border-color:rgba(165,180,252,.30)}
.txt{position:absolute;left:475px;top:50%;transform:translateY(-50%);right:50px}
h1{font-size:46px;line-height:1.12;font-weight:800;letter-spacing:-.025em}
h1 span{background:linear-gradient(135deg,#a5b4fc,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.chips i{font-style:normal;font-weight:600;font-size:19px;padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(165,180,252,.28);color:#e0e7ff}
.url{position:absolute;right:50px;bottom:26px;font-size:18px;font-weight:600;color:#a5b4fc}
</style></head><body><div class="glow"></div><div class="grid"></div><div class="ring"></div><div class="ring r2"></div>
<div class="txt"><h1>AI-powered tools for the<br><span>software delivery lifecycle</span></h1><div class="chips"><i>VigilQA</i><i>SpecVault</i><i>AgentPulse</i><i>DocForge</i><i>TalentDesk</i></div></div>
<div class="url">sentinelflux.in</div></body></html>
